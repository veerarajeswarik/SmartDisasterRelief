# Application
spring.application.name=disaster-relief-backend
server.port=8080

# Use the bundled H2 demo database by default so the app works immediately
# without a local PostgreSQL install. To use PostgreSQL instead, switch the
# active profile or override this setting in environment variables.
spring.profiles.active=h2

# ============================================================
# DATABASE — PostgreSQL (fallback for local setup)
# Change the password below to your PostgreSQL password
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/disaster_relief_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT
app.jwt.secret=DisasterReliefSecretKey2024ThisIsAVeryLongSecretKeyForJWTAuthentication
app.jwt.expiration=86400000

# Google OAuth2
# Get these from https://console.cloud.google.com/
app.google.client-id=YOUR_GOOGLE_CLIENT_ID_HERE

# Admin bootstrap — the Google account that logs in with this email gets ADMIN role
app.admin.email=admin@example.com

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.disasterrelief=INFO
logging.level.org.springframework.security=WARN
