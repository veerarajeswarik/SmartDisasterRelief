# H2 In-Memory Database (no setup needed — use if PostgreSQL password is unknown)
# Run with: mvn spring-boot:run "-Dspring-boot.run.profiles=h2"
spring.datasource.url=jdbc:h2:mem:disasterreliefdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=true

# Google OAuth2 — replace with your real client ID
app.google.client-id=YOUR_GOOGLE_CLIENT_ID_HERE

# First admin email — user logging in with this Google email gets ADMIN automatically
app.admin.email=admin@example.com
